<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe</title></head><body>
<div id="r">running</div>
<script>
var log = [];
function done() { document.getElementById("r").textContent = log.join(" | "); }

// 1) 东财 JSON
fetch("https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001,0.399006&fields=f2,f3,f4,f12,f13,f14,f18",
      { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    var d = j && j.data && j.data.diff;
    log.push("EM_OK:" + (d ? d.length + "条 " + d[0].f14 + "=" + d[0].f2 + " " + d[0].f3 + "%" : "空"));
    done();
  })
  .catch(function (e) { log.push("EM_FAIL:" + e.message); done(); });

// 2) 腾讯 GBK
fetch("https://qt.gtimg.cn/q=sh000001", { cache: "no-store" })
  .then(function (r) { return r.arrayBuffer(); })
  .then(function (buf) {
    var t = new TextDecoder("gbk").decode(buf);
    var m = /v_sh000001="([^"]*)"/.exec(t);
    var b = m ? m[1].split("~") : [];
    log.push("TX_OK:" + (b.length > 32 ? b[2] + " " + b[3] + " " + b[32] + "%" : "解析失败"));
    done();
  })
  .catch(function (e) { log.push("TX_FAIL:" + e.message); done(); });
</script></body></html>
