<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="量化看盘">
<meta name="application-name" content="量化看盘">
<title>量化看盘</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f16; color: #e9eff8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #frame {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; display: block; background: #0b0f16;
  }

  /* 载入遮罩 */
  #boot {
    position: fixed; inset: 0; z-index: 9;
    background: #0b0f16;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; transition: opacity .34s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  .spin {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, .14);
    border-top-color: #6d8fff;
    animation: sp .82s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .boot-txt { font-size: 13px; color: #8a99ae; letter-spacing: .3px; text-align: center; padding: 0 24px; }

  /* 失败卡片 */
  #fail {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: #0b0f16;
    padding: 28px 24px; text-align: center;
  }
  #fail.on { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .f-ico {
    width: 46px; height: 46px; border-radius: 50%; margin-bottom: 16px;
    display: grid; place-items: center;
    background: rgba(240, 180, 92, .12); border: 1px solid rgba(240, 180, 92, .32);
    color: #f0b45c; font-size: 22px; font-weight: 800;
  }
  .f-title { font-size: 16px; font-weight: 780; margin: 0 0 8px; }
  .f-desc {
    font-size: 12.5px; line-height: 1.75; color: #8a99ae;
    margin: 0 0 22px; max-width: 300px;
  }
  .f-btn {
    font-family: inherit; font-size: 13.5px; font-weight: 750;
    color: #0b0f16; background: #6d8fff; border: 0;
    padding: 10px 26px; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .f-btn:active { transform: scale(.97); }
  .f-link {
    display: inline-block; margin-top: 16px;
    font-size: 12px; color: #5b6b83; text-decoration: none;
    border-bottom: 1px solid rgba(91, 107, 131, .4); padding-bottom: 1px;
  }
  .f-link2 { display: block; margin-top: 10px; font-size: 12px; color: #6d8fff; text-decoration: none; }
</style>
</head>
<body>

<iframe id="frame" title="量化看盘" allow="clipboard-write"></iframe>

<div id="boot">
  <div class="spin"></div>
  <div class="boot-txt" id="boot-txt">正在连接你的电脑…</div>
</div>

<div id="fail">
  <div class="f-ico">!</div>
  <p class="f-title">连不上看盘服务</p>
  <p class="f-desc" id="fail-desc">
    电脑可能关机了，或者通道没开。<br>回到电脑上打开看板，把「换网络也能看」打开即可。
  </p>
  <button class="f-btn" id="retry">重试</button>
  <a class="f-link" id="direct" href="#" target="_self" hidden>直接打不开？试原始地址</a>
  <a class="f-link2" href="./snap.html">先看上次保存的快照 →</a>
</div>

<script>
(function () {
  "use strict";

  var frame = document.getElementById("frame");
  var boot = document.getElementById("boot");
  var bootTxt = document.getElementById("boot-txt");
  var fail = document.getElementById("fail");
  var failDesc = document.getElementById("fail-desc");
  var direct = document.getElementById("direct");
  var done = false;
  var timers = [];

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  function hideBoot() {
    if (done) return;
    done = true;
    clearTimers();
    boot.classList.add("gone");
    setTimeout(function () { boot.style.display = "none"; }, 400);
  }

  function showFail(msg) {
    if (done) return;
    clearTimers();
    boot.style.display = "none";
    fail.classList.add("on");
    if (msg) failDesc.innerHTML = msg;
  }

  // 三个源同时读：同源 latest.json / raw（5 分钟 CDN）/ GitHub API（不走 CDN，有频次限制）。
  // 关键：全部加超时。raw 与 api.github.com 在国内网络经常「连不上也不报错」，
  // 没有超时就会永远卡在「正在连接你的电脑…」——这就是之前一直转圈的原因。
  var SRC = ["./latest.json", "https://raw.githubusercontent.com/CJ112358/kanpan/main/latest.json"];
  var API_SRC = "https://api.github.com/repos/CJ112358/kanpan/contents/latest.json";
  var API_KEY = "kp-api-cache";

  function withTimeout(makeFetch, ms) {
    return new Promise(function (resolve, reject) {
      var ctl = window.AbortController ? new AbortController() : null;
      var fired = false;
      var t = setTimeout(function () {
        fired = true;
        if (ctl) { try { ctl.abort(); } catch (e) {} }
        reject(new Error("timeout"));
      }, ms || 4000);
      makeFetch(ctl).then(function (v) {
        if (fired) return;
        clearTimeout(t); resolve(v);
      }, function (e) {
        if (fired) return;
        clearTimeout(t); reject(e);
      });
    });
  }

  function loadOne(u) {
    var sep = u.indexOf("?") < 0 ? "?" : "&";
    return withTimeout(function (ctl) {
      return fetch(u + sep + "t=" + Date.now(), {
        cache: "no-store", signal: ctl ? ctl.signal : undefined
      }).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      }).then(function (d) {
        if (!d || !d.url) throw new Error("empty");
        return d;
      });
    }, 4000);
  }

  function loadApi(fresh) {
    if (!fresh) {
      try {
        var c = JSON.parse(localStorage.getItem(API_KEY) || "null");
        if (c && c.t && Date.now() - c.t < 60000 && c.url) return Promise.resolve(c);
      } catch (e) {}
    }
    return withTimeout(function (ctl) {
      return fetch(API_SRC + "?t=" + Date.now(), {
        cache: "no-store", signal: ctl ? ctl.signal : undefined
      }).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      }).then(function (j) {
        var txt = "";
        if (j && j.content) {
          txt = decodeURIComponent(escape(window.atob(String(j.content).replace(/\s+/g, ""))));
        }
        var d = JSON.parse(txt);
        if (!d || !d.url) throw new Error("empty");
        d.t = Date.now();
        try { localStorage.setItem(API_KEY, JSON.stringify(d)); } catch (e) {}
        return d;
      });
    }, 4000);
  }

  // 拿到第一个可用地址就先走，最多再多等 0.7 秒看有没有更新的时间戳
  function pickBest() {
    var list = [loadOne(SRC[0]), loadOne(SRC[1]), loadApi()];
    return new Promise(function (resolve) {
      var best = null, left = list.length, closed = false;
      function close(v) { if (!closed) { closed = true; resolve(v); } }
      function maybe() {
        left--;
        if (best && (left === 0 || Date.now() >= t0 + 700)) close(best);
        else if (!best && left === 0) close(null);
      }
      var t0 = Date.now();
      list.forEach(function (p) {
        p.then(function (d) {
          if (!best || Number(d.ts || 0) > Number(best.ts || 0)) best = d;
          maybe();
        }, maybe);
      });
      // 0.7 秒后只要有结果就先走；没结果就继续等（每个源 4 秒必断，不会无限等）
      setTimeout(function () { if (best) close(best); }, 720);
    });
  }

  // 只要通道能响应就算活着（不看内容，跨域拿不到内容）
  function probe(u, ms) {
    return withTimeout(function (ctl) {
      return fetch(u, {
        mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined
      }).then(function () { return true; });
    }, ms || 7000).then(function () { return true; }, function () { return false; });
  }

  function goLive(url) {
    direct.href = url;
    direct.hidden = false;
    frame.src = url;
    probe(url, 7000).then(function (ok) {
      // 通道活着：最多再等 5 秒收遮罩，别死等 iframe 的 load（子资源慢时可能很久不触发）
      if (ok) later(hideBoot, 5000);
      else later(function () {
        bootTxt.textContent = "连不上电脑，正在打开上次的快照…";
        showSnap();
      }, 800);
    });
    later(function () { bootTxt.textContent = "网络较慢，还在连接…"; }, 6000);
    later(function () {
      // 16 秒还没连上：先问一次真身地址，地址变了就换，否则上快照
      bootTxt.textContent = "电脑好像没响应，正在打开上次的快照…";
      loadApi(true).then(function (d) {
        if (d && d.url && d.url !== url) goLive(d.url);
        else showSnap();
      }).catch(showSnap);
    }, 16000);
  }

  function showSnap() {
    clearTimers();
    bootTxt.textContent = "电脑不在线，正在打开上次的快照…";
    frame.src = "./snap.html?t=" + Date.now();
  }

  function run() {
    done = false;
    clearTimers();
    fail.classList.remove("on");
    boot.style.display = "flex";
    boot.classList.remove("gone");
    bootTxt.textContent = "正在连接你的电脑…";

    pickBest().then(function (best) {
      if (!best) { showSnap(); return; }
      if (best.updated) bootTxt.textContent = "正在连接（" + best.updated + " 的通道）…";
      goLive(best.url);
    }).catch(function () { showSnap(); });
  }

  frame.addEventListener("load", function () {
    if (frame.src) setTimeout(hideBoot, 260);
  });

  document.getElementById("retry").addEventListener("click", run);

  run();
})();
</script>
</body>
</html>
